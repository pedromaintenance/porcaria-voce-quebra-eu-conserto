name: One-shot repair Bia field atlas on PR branch

on:
  push:
    branches: [fix/bia-phone-helmet-asset-20261020]
    paths:
      - .github/workflows/commit-bia-repaired.yml

permissions:
  contents: write

jobs:
  repair-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Pillow
        run: python -m pip install --quiet Pillow
      - name: Repair transparent WebP sprite sheet
        run: python scripts/repair-bia-field-atlas.py
      - name: Commit repaired asset to same branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phaser-play/assets/characters/bia/bia-field-repaired-4poses.webp
          git diff --cached --quiet && exit 0
          git commit -m "fix(asset): add recovered-helmet Bia field spritesheet"
          git push origin HEAD:fix/bia-phone-helmet-asset-20261020
