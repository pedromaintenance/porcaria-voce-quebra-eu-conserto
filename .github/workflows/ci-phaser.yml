name: P.O.R.C.A.R.I.A. — Phaser CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phaser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check engine.js && node --check phaser-play/game.js && node --check phaser-play/readiness.js && node --check phaser-play/diagnostic-board.js && node --check phaser-play/diagnostic-view.js && node --check scripts/test-readiness-navigation.cjs && node --check scripts/test-diagnostic.cjs && node --check scripts/test-diagnostic-teaching.cjs && node --check scripts/test-777-override.cjs && node --check phaser-play/closed-orders.js && node --check scripts/test-closed-orders.cjs && node --check scripts/test-bay-contact.cjs && node --check scripts/test-day-night-fullframe.cjs && node --check scripts/test-worker-roster.cjs && node --check scripts/test-dr410i-asset.cjs && node --check scripts/test-bia-training-assets.cjs
      - name: Full Phaser regression suite
        run: |
          node scripts/smoke-phaser.cjs
          node scripts/test-shift-brief.cjs
          node scripts/test-planning.cjs
          node scripts/test-weekly.cjs
          node scripts/test-shifts-productivity.cjs
          node scripts/test-scene-profiles.cjs
          node scripts/test-777-asset.cjs
          node scripts/test-night-workshop.cjs
          node scripts/test-readiness.cjs
          node scripts/test-readiness-navigation.cjs
          node scripts/test-diagnostic.cjs
          node scripts/test-diagnostic-teaching.cjs
          node scripts/test-777-override.cjs
          node scripts/test-closed-orders.cjs
          node scripts/test-bay-contact.cjs
          node scripts/test-day-night-fullframe.cjs
          node scripts/test-worker-roster.cjs
          node scripts/test-dr410i-asset.cjs
          node scripts/test-bia-training-assets.cjs
