name: PORCARIA - Ciclo 42 Blueprint Browser QA
on:
  pull_request:
    paths:
      - 'phaser-play/assembly-workbench.html'
      - 'phaser-play/assembly-sequence.js'
      - 'phaser-play/assembly-hold.js'
      - 'scripts/test-assembly-browser-v42.cjs'
      - '.github/workflows/assembly-browser-v42.yml'
  push:
    branches: [main]
    paths:
      - 'phaser-play/assembly-workbench.html'
      - 'phaser-play/assembly-sequence.js'
      - 'phaser-play/assembly-hold.js'
      - 'scripts/test-assembly-browser-v42.cjs'
      - '.github/workflows/assembly-browser-v42.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-touch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Start isolated webserver
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/porcaria-bench.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/phaser-play/assembly-workbench.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Test desktop and phone interactions
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/test-assembly-browser-v42.cjs
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciclo42-blueprint-browser
          path: test-results/assembly-v42/
          retention-days: 14
          if-no-files-found: warn
