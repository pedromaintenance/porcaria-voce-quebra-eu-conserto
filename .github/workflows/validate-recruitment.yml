name: Validate P.O.R.C.A.R.I.A. recruitment
on:
  pull_request:
    paths:
      - 'engine.js'
      - 'phaser-play/**'
      - 'scripts/**'
      - 'sw.js'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax
        run: node --check engine.js && node --check phaser-play/game.js && node --check scripts/test-worker-roster.cjs && node --check scripts/test-acassio.cjs && node --check scripts/test-junior-specialist.cjs && node --check scripts/test-named-recruits.cjs && node --check scripts/test-worker-visual-quality.cjs && node --check scripts/test-supervisor-assets.cjs && node --check phaser-play/order-quick.js && node --check scripts/test-order-quick.cjs && node --check scripts/test-skills.cjs && node --check training.js && node --check phaser-play/training-view.js && node --check scripts/test-training.cjs && node --check competency.js && node --check scripts/test-competency.cjs && node --check scripts/test-di650i-asset.cjs && node --check scripts/test-pedro-asset.cjs && node --check scripts/test-training-layout.cjs
      - name: Test simulation and recruitment
        run: node scripts/smoke-phaser.cjs && node scripts/test-worker-roster.cjs && node scripts/test-acassio.cjs && node scripts/test-junior-specialist.cjs && node scripts/test-readiness.cjs && node scripts/test-weekly.cjs && node scripts/test-shifts-productivity.cjs
      - name: Verify six sprite files
        run: node scripts/test-named-recruits.cjs && node scripts/test-worker-visual-quality.cjs && node scripts/test-supervisor-assets.cjs && node scripts/test-order-quick.cjs && node scripts/test-skills.cjs && node scripts/test-training.cjs && node scripts/test-competency.cjs && node scripts/test-di650i-asset.cjs && node scripts/test-pedro-asset.cjs && node scripts/test-training-layout.cjs
