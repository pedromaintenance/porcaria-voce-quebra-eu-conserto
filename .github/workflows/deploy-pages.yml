name: Deploy P.O.R.C.A.R.I.A. to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Phaser JavaScript syntax
        run: node --check phaser-play/game.js && node --check engine.js
      - name: Regression tests (engine and scene map)
        run: node scripts/smoke-phaser.cjs
      - name: Check Pages entrypoints
        run: test -f phaser-play/index.html && test -f phaser-play/game.js && test -f phaser-play/scene-map.json && test -f game-data.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
