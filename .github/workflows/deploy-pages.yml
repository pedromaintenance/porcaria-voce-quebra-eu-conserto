name: Deploy P.O.R.C.A.R.I.A. to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Phaser JavaScript syntax
        run: node --check phaser-play/readiness.js && node --check phaser-play/diagnostic-board.js && node --check phaser-play/diagnostic-view.js && node --check scripts/test-diagnostic-teaching.cjs && node --check phaser-play/layout-math.js && node --check phaser-play/game.js && node --check phaser-play/planning.js && node --check phaser-play/weekly.js && node --check phaser-play/shift-brief.js && node --check engine.js && node --check scripts/test-777-override.cjs && node --check phaser-play/closed-orders.js && node --check scripts/test-closed-orders.cjs && node --check scripts/test-bay-contact.cjs && node --check scripts/test-day-night-fullframe.cjs && node --check scripts/test-worker-roster.cjs && node --check scripts/test-nemuel-inspector.cjs && node --check scripts/test-acassio.cjs && node --check scripts/test-cat395-asset.cjs && node --check scripts/test-unlimited-limits.cjs && node --check scripts/test-dr410i-asset.cjs && node --check scripts/test-loader-grader-dozer-asset.cjs && node --check scripts/test-junior-specialist.cjs && node --check scripts/test-named-recruits.cjs && node --check scripts/test-worker-visual-quality.cjs && node --check scripts/test-bia-training-assets.cjs && node --check scripts/test-supervisor-assets.cjs && node --check phaser-play/order-quick.js && node --check scripts/test-order-quick.cjs && node --check scripts/test-skills.cjs && node --check training.js && node --check phaser-play/training-view.js && node --check scripts/test-training.cjs && node --check competency.js && node --check scripts/test-competency.cjs && node --check scripts/test-di650i-asset.cjs && node --check scripts/test-pedro-asset.cjs && node --check scripts/test-training-layout.cjs && node --check scripts/test-functional-locations-pt.cjs && node --check scripts/test-fmea-playbook-cases.cjs && node --check scripts/test-fmea-expansion.cjs && node --check scripts/test-electronic-fmea-session2.cjs && node --check scripts/test-hydraulic-fmea-session3.cjs && node --check scripts/test-diesel-oil-fmea-session4.cjs && node --check scripts/test-drill-pneumatic-fmea-session5.cjs && node --check scripts/test-drivetrain-fmea-session6.cjs && node --check phaser-play/evidence.js && node --check scripts/test-evidence-investigation-session8.cjs && node --check phaser-play/monitoring.js && node --check scripts/test-monitoring-session9.cjs && node --check phaser-play/sector-views.js && node --check scripts/test-sector-restructure-stage1.cjs && node --check scripts/test-elton-radio-queue.cjs && node --check scripts/test-progressive-fmea-session7.cjs && node --check phaser-play/inspection.js && node --check phaser-play/inspection-view.js && node --check scripts/test-inspections.cjs && node --check scripts/test-pcm-notification-review.cjs && node --check scripts/test-pcm-gameplay.cjs
      - name: Regression tests (engine and scene map)
        run: node scripts/smoke-phaser.cjs && node scripts/test-shift-brief.cjs && node scripts/test-planning.cjs && node scripts/test-weekly.cjs && node scripts/test-shifts-productivity.cjs && node scripts/test-scene-profiles.cjs && node scripts/test-777-asset.cjs && node scripts/test-night-workshop.cjs && node scripts/test-readiness.cjs && node scripts/test-readiness-navigation.cjs && node scripts/test-diagnostic.cjs && node scripts/test-diagnostic-teaching.cjs && node scripts/test-777-override.cjs && node scripts/test-closed-orders.cjs && node scripts/test-bay-contact.cjs && node scripts/test-day-night-fullframe.cjs && node scripts/test-worker-roster.cjs && node scripts/test-nemuel-inspector.cjs && node scripts/test-acassio.cjs && node scripts/test-cat395-asset.cjs && node scripts/test-unlimited-limits.cjs && node test_engine.js && node scripts/test-dr410i-asset.cjs && node scripts/test-loader-grader-dozer-asset.cjs && node scripts/test-junior-specialist.cjs && node scripts/test-bia-training-assets.cjs && node scripts/test-supervisor-assets.cjs && node scripts/test-order-quick.cjs && node scripts/test-skills.cjs && node scripts/test-training.cjs && node scripts/test-competency.cjs && node scripts/test-di650i-asset.cjs && node scripts/test-pedro-asset.cjs && node scripts/test-training-layout.cjs && node scripts/test-functional-locations-pt.cjs && node scripts/test-fmea-playbook-cases.cjs && node scripts/test-fmea-expansion.cjs && node scripts/test-electronic-fmea-session2.cjs && node scripts/test-hydraulic-fmea-session3.cjs && node scripts/test-diesel-oil-fmea-session4.cjs && node scripts/test-drill-pneumatic-fmea-session5.cjs && node scripts/test-drivetrain-fmea-session6.cjs && node scripts/test-evidence-investigation-session8.cjs && node scripts/test-monitoring-session9.cjs && node scripts/test-sector-restructure-stage1.cjs && node scripts/test-elton-radio-queue.cjs && node scripts/test-progressive-fmea-session7.cjs && node scripts/test-inspections.cjs && node scripts/test-pcm-notification-review.cjs && node scripts/test-pcm-gameplay.cjs && node scripts/test-named-recruits.cjs && node scripts/test-worker-visual-quality.cjs
      - name: Verify Bia training library files
        run: |
          test -f phaser-play/assets/characters/bia/manifest.json
          test -f phaser-play/assets/characters/bia/index.html
          test -f phaser-play/TRAINING_DESIGN.md
          echo "0fc4202e7093374536e1714f34167c1847764db0bc0a40c7f49c3586df021e4e  phaser-play/assets/characters/bia/bia-feedback-4poses.webp" | sha256sum --check
          echo "69100bdf99c0b1cbecdddbceb64f8ca4f0d8109602e3a5dd89fc6414811f1009  phaser-play/assets/characters/bia/bia-inspection-4poses.webp" | sha256sum --check
          echo "f9af54e86ef4223a8566fe9cbfb7742c84cdce9f826b62f292c5afae85d26a99  phaser-play/assets/characters/bia/bia-field-4poses.webp" | sha256sum --check
          echo "0df565e155bea199facfd3c6a0032c2afba7cfcba59ad9d057c282cff877c538  phaser-play/assets/characters/bia/bia-field-repaired-4poses.webp" | sha256sum --check
          echo "e420ea6b416d0f2a5037a95dc3068faf91dd7f4480377a8e515a14b596389b85  phaser-play/assets/characters/bia/bia-coaching-4poses.webp" | sha256sum --check
      - name: Check Pages entrypoints
        run: test -f phaser-play/order-quick.js && test -f phaser-play/readiness.js && test -f phaser-play/diagnostic-board.js && test -f phaser-play/diagnostic-view.js && test -f phaser-play/closed-orders.js && test -f phaser-play/assets/OFICINA-NOTURNA.md && test -f phaser-play/index.html && test -f phaser-play/game.js && test -f phaser-play/planning.js && test -f phaser-play/weekly.js && test -f phaser-play/scene-map.json && test -f phaser-play/assets/oficina-diurna-fullframe.avif && test -f phaser-play/assets/characters/costa-4poses.webp && test -f phaser-play/assets/characters/silva-4poses.webp && test -f phaser-play/assets/characters/santos-4poses.webp && test -f phaser-play/assets/characters/moura-4poses.webp && test -f phaser-play/assets/characters/pedro-v0829-4poses.png && test -f phaser-play/assets/characters/geovane-4poses.webp && test -f game-data.json
      - name: Verify both Junior sprite atlases
        run: |
          test -f phaser-play/assets/characters/junior/manifest.json
          echo "752ac264efe56c7a93d80780b94f9a344c4562c8a4ac7b82615aa82c0ed4e5b2  phaser-play/assets/characters/junior/junior-work-4poses.webp" | sha256sum --check
          echo "a652d9f9666e9cfaa4970cfbe3d6e51bafeef3f7a0e3963463fbdcf1fd5c2ab7  phaser-play/assets/characters/junior/junior-training-4poses.webp" | sha256sum --check
      - name: Verify official six worker sprites
        run: |
          echo "32b708ae3c33555e26602730644f6848daa49bbd168a51aa6b1e31de9a4edcd2  phaser-play/assets/characters/costa-4poses.webp" | sha256sum --check
          echo "ba160e74d97ab8a469b26b524049f625f89ff08bf6997a6427efb79b4b637d44  phaser-play/assets/characters/pedro-v0829-4poses.png" | sha256sum --check
          echo "229f8caddeb6fc332972c94841342424f74da65dcd37479bd51a3524c888470a  phaser-play/assets/characters/geovane-4poses.webp" | sha256sum --check
          echo "26f68b092d14bfb940a7e44577b1d117d14571b27bd69fc0a248124102c849eb  phaser-play/assets/characters/silva-4poses.webp" | sha256sum --check
          echo "48105f1036d2b9693531abb349954f251e1c2d31c4a599e8cdd7ad9c0d5f89ce  phaser-play/assets/characters/santos-4poses.webp" | sha256sum --check
          echo "eba522ff337b6838cd4e2f5f77043c7e410bf32a425d2dd243a143f9b64fd99d  phaser-play/assets/characters/moura-4poses.webp" | sha256sum --check
      - name: Verify official workshop image
        run: |
          test -s phaser-play/assets/oficina-base.avif
          echo "8d13599f38ac559f12a4c62e44119f1e432f5d8abc83b593d5a7ae852ef3f2bd  phaser-play/assets/oficina-base.avif" | sha256sum --check
      - name: Verify original full-frame daytime workshop
        run: |
          test -s phaser-play/assets/oficina-diurna-fullframe.avif
          echo "31453309223d11800e78276edd2e02b641a82eb4a2ffb52982dbc766e0a003c7  phaser-play/assets/oficina-diurna-fullframe.avif" | sha256sum --check
      - name: Verify new CAT D9 CAT 966 CAT 16 sprites
        run: |
          echo "ca914d9882d5b6f7f8548a17152b3170dfa0906f2dc527446785d54255dbc952  phaser-play/assets/equipment/catd9-dozer-v0819.webp" | sha256sum --check
          echo "044b425baf37f4836482c5b9cd28824f30b638b0504cde40b27117116d4de700  phaser-play/assets/equipment/cat966-loader-v0819.webp" | sha256sum --check
          echo "dd520eeca708c389235fd2c4707bfd42e99dff567fd79c5d4ecc2d56bb3c35de  phaser-play/assets/equipment/cat16-grader-v0819.webp" | sha256sum --check
      - name: Verify DR410i official new asset
        run: |
          test -s phaser-play/assets/equipment/sandvik_dr410i_v2.webp
          echo "ccea0bbc7380d683dc44dcd06281b80af4150147fb6250ef8db6c009ec1da13a  phaser-play/assets/equipment/sandvik_dr410i_v2.webp" | sha256sum --check
      - name: Verify new 777E transparent texture
        run: |
          test -s phaser-play/assets/equipment/cat777e_v3.webp
          echo "bec258a0b4afb512cae047a0a3c10ff7072be2dba5156b826c57fb0ca137a4bd  phaser-play/assets/equipment/cat777e_v3.webp" | sha256sum --check
      - name: Verify official night workshop image
        run: |
          test -s phaser-play/assets/oficina-noturna-hq.avif
          echo "0637e55b3a1978842c7aa71e27c763b176ea7c8438a82ee5bc711140e1a72c15  phaser-play/assets/oficina-noturna-hq.avif" | sha256sum --check
      - name: Verify Planning PCM room artwork
        run: node scripts/test-planning-room-asset.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
