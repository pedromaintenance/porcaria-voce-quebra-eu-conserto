name: Deploy P.O.R.C.A.R.I.A. to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Phaser JavaScript syntax
        run: node --check phaser-play/readiness.js && node --check phaser-play/diagnostic-board.js && node --check phaser-play/diagnostic-view.js && node --check scripts/test-diagnostic-teaching.cjs && node --check phaser-play/layout-math.js && node --check phaser-play/game.js && node --check phaser-play/planning.js && node --check phaser-play/weekly.js && node --check phaser-play/shift-brief.js && node --check engine.js && node --check scripts/test-777-override.cjs && node --check phaser-play/closed-orders.js && node --check scripts/test-closed-orders.cjs && node --check scripts/test-bay-contact.cjs && node --check scripts/test-day-night-fullframe.cjs && node --check scripts/test-worker-roster.cjs && node --check scripts/test-bia-training-assets.cjs
      - name: Regression tests (engine and scene map)
        run: node scripts/smoke-phaser.cjs && node scripts/test-shift-brief.cjs && node scripts/test-planning.cjs && node scripts/test-weekly.cjs && node scripts/test-shifts-productivity.cjs && node scripts/test-scene-profiles.cjs && node scripts/test-777-asset.cjs && node scripts/test-night-workshop.cjs && node scripts/test-readiness.cjs && node scripts/test-readiness-navigation.cjs && node scripts/test-diagnostic.cjs && node scripts/test-diagnostic-teaching.cjs && node scripts/test-777-override.cjs && node scripts/test-closed-orders.cjs && node scripts/test-bay-contact.cjs && node scripts/test-day-night-fullframe.cjs && node scripts/test-worker-roster.cjs && node scripts/test-bia-training-assets.cjs
      - name: Verify Bia training library files
        run: |
          test -f phaser-play/assets/characters/bia/manifest.json
          test -f phaser-play/assets/characters/bia/index.html
          test -f phaser-play/TRAINING_DESIGN.md
          echo "0fc4202e7093374536e1714f34167c1847764db0bc0a40c7f49c3586df021e4e  phaser-play/assets/characters/bia/bia-feedback-4poses.webp" | sha256sum --check
          echo "69100bdf99c0b1cbecdddbceb64f8ca4f0d8109602e3a5dd89fc6414811f1009  phaser-play/assets/characters/bia/bia-inspection-4poses.webp" | sha256sum --check
          echo "f9af54e86ef4223a8566fe9cbfb7742c84cdce9f826b62f292c5afae85d26a99  phaser-play/assets/characters/bia/bia-field-4poses.webp" | sha256sum --check
          echo "e420ea6b416d0f2a5037a95dc3068faf91dd7f4480377a8e515a14b596389b85  phaser-play/assets/characters/bia/bia-coaching-4poses.webp" | sha256sum --check
      - name: Check Pages entrypoints
        run: test -f phaser-play/readiness.js && test -f phaser-play/diagnostic-board.js && test -f phaser-play/diagnostic-view.js && test -f phaser-play/closed-orders.js && test -f phaser-play/assets/OFICINA-NOTURNA.md && test -f phaser-play/index.html && test -f phaser-play/game.js && test -f phaser-play/planning.js && test -f phaser-play/weekly.js && test -f phaser-play/scene-map.json && test -f phaser-play/assets/oficina-diurna-fullframe.avif && test -f phaser-play/assets/characters/costa-4poses.webp && test -f phaser-play/assets/characters/silva-4poses.webp && test -f phaser-play/assets/characters/santos-4poses.webp && test -f phaser-play/assets/characters/moura-4poses.webp && test -f phaser-play/assets/characters/pedro-4poses.webp && test -f phaser-play/assets/characters/geovane-4poses.webp && test -f game-data.json
      - name: Verify official six worker sprites
        run: |
          echo "32b708ae3c33555e26602730644f6848daa49bbd168a51aa6b1e31de9a4edcd2  phaser-play/assets/characters/costa-4poses.webp" | sha256sum --check
          echo "4942108bc9e3d4ab40a086acdcd702cd0ea684f298b2c7c8a242a44b684488ea  phaser-play/assets/characters/pedro-4poses.webp" | sha256sum --check
          echo "229f8caddeb6fc332972c94841342424f74da65dcd37479bd51a3524c888470a  phaser-play/assets/characters/geovane-4poses.webp" | sha256sum --check
          echo "26f68b092d14bfb940a7e44577b1d117d14571b27bd69fc0a248124102c849eb  phaser-play/assets/characters/silva-4poses.webp" | sha256sum --check
          echo "48105f1036d2b9693531abb349954f251e1c2d31c4a599e8cdd7ad9c0d5f89ce  phaser-play/assets/characters/santos-4poses.webp" | sha256sum --check
          echo "eba522ff337b6838cd4e2f5f77043c7e410bf32a425d2dd243a143f9b64fd99d  phaser-play/assets/characters/moura-4poses.webp" | sha256sum --check
      - name: Verify official workshop image
        run: |
          test -s phaser-play/assets/oficina-base.avif
          echo "8d13599f38ac559f12a4c62e44119f1e432f5d8abc83b593d5a7ae852ef3f2bd  phaser-play/assets/oficina-base.avif" | sha256sum --check
      - name: Verify original full-frame daytime workshop
        run: |
          test -s phaser-play/assets/oficina-diurna-fullframe.avif
          echo "31453309223d11800e78276edd2e02b641a82eb4a2ffb52982dbc766e0a003c7  phaser-play/assets/oficina-diurna-fullframe.avif" | sha256sum --check
      - name: Verify new 777E transparent texture
        run: |
          test -s phaser-play/assets/equipment/cat777e_v3.webp
          echo "bec258a0b4afb512cae047a0a3c10ff7072be2dba5156b826c57fb0ca137a4bd  phaser-play/assets/equipment/cat777e_v3.webp" | sha256sum --check
      - name: Verify official night workshop image
        run: |
          test -s phaser-play/assets/oficina-noturna-hq.avif
          echo "0637e55b3a1978842c7aa71e27c763b176ea7c8438a82ee5bc711140e1a72c15  phaser-play/assets/oficina-noturna-hq.avif" | sha256sum --check
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
